<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="dark" />
<title>登录 · 网格交易总控台</title>
<style>
:root{
  --bg:#0a0e17;--panel:#141924;--panel2:#1a2235;--border:#1e2d45;--border2:#253350;
  --txt:#dde6f0;--mut:#8fa5c0;--mut2:#5b6f8c;--pur:#8b5cf6;--pur2:#7c3aed;--red:#ef4444;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:radial-gradient(120% 80% at 50% -10%,#16203a 0%,#0a0e17 60%);
  color:var(--txt);
  font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
  display:flex;align-items:center;justify-content:center;
  padding:calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 16px);
  min-height:100dvh;
}
.card{
  width:100%;max-width:360px;background:var(--panel);border:1px solid var(--border);
  border-radius:16px;padding:30px 24px 24px;box-shadow:0 24px 60px rgba(0,0,0,.55);
}
.logo{font-size:19px;font-weight:700;text-align:center;letter-spacing:-.3px}
.logo span{color:var(--pur)}
.sub{color:var(--mut);font-size:12px;text-align:center;margin:6px 0 22px}
label{display:block;font-size:12px;color:var(--mut);margin:16px 0 6px}
input{
  width:100%;padding:13px 14px;background:var(--panel2);border:1px solid var(--border2);
  border-radius:10px;color:var(--txt);font-size:16px;outline:none; /* 16px 防 iOS 缩放 */
  -webkit-appearance:none;appearance:none;transition:border-color .15s,box-shadow .15s;
}
input:focus{border-color:var(--pur);box-shadow:0 0 0 3px rgba(139,92,246,.2)}
input::placeholder{color:var(--mut2)}
.btn{
  width:100%;margin-top:24px;padding:14px;border:none;border-radius:10px;cursor:pointer;
  background:linear-gradient(135deg,var(--pur),var(--pur2));color:#fff;font-size:16px;font-weight:600;
  transition:filter .15s,transform .05s;tap-highlight-color:transparent;
}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.6;cursor:not-allowed}
.err{color:var(--red);font-size:13px;min-height:18px;margin-top:14px;text-align:center}
.hint{color:var(--mut);font-size:11px;text-align:center;margin-top:20px;line-height:1.6}
@media (max-width:380px){
  .card{padding:24px 16px 18px;border-radius:14px}
  body{font-size:14px}
}
</style>
</head>
<body>
<form class="card" id="f" autocomplete="on">
  <div class="logo">网格交易<span>总控台</span></div>
  <div class="sub">请登录后使用</div>
  <label for="email">邮箱</label>
  <input id="email" name="email" type="email" autocomplete="username" required
         placeholder="you@example.com" inputmode="email" />
  <label for="password">密码</label>
  <input id="password" name="password" type="password" autocomplete="current-password" required
         placeholder="••••••••" />
  <div class="err" id="err" role="alert"></div>
  <button class="btn" type="submit" id="btn">登 录</button>
  <div class="hint">仅授权用户可访问。会话将在一段时间后自动过期。</div>
</form>
<script>
// 已登录则直接进主页，免去重复登录
fetch('/api/auth/me').then(r=>r.json()).then(m=>{ if(m&&m.authed) location.replace('/'); }).catch(()=>{});
var f=document.getElementById('f'),err=document.getElementById('err'),btn=document.getElementById('btn');
f.addEventListener('submit', async function(e){
  e.preventDefault();
  err.textContent=''; btn.disabled=true; btn.textContent='登录中…';
  var email=document.getElementById('email').value.trim();
  var password=document.getElementById('password').value;
  try{
    var r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email,password:password})});
    var j=await r.json().catch(function(){return {};});
    if(r.ok && j.ok){ location.replace('/'); return; }
    err.textContent=j.error || ('登录失败（'+r.status+'）');
  }catch(ex){
    err.textContent='网络错误，请重试。';
  }
  btn.disabled=false; btn.textContent='登 录';
});
document.getElementById('email').focus();
</script>
</body>
</html>
